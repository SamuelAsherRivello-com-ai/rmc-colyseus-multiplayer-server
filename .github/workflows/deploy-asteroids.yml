name: Deploy isolated Asteroids backend release
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
permissions:
  contents: read
concurrency:
  group: vercel-asteroids-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.ASTEROIDS_VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:typescript-source
      - run: npm run typecheck
      - name: Require immutable main source, dedicated project and Hobby plan
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          test -n "$VERCEL_PROJECT_ID"
          node --import tsx scripts/workflows/deploy-asteroids-1.ts
      - run: npm run check:docs
      # Version preparation may safely rebase over concurrent main changes.
      # Verify the final immutable source, including any such changes.
      - run: npm test
      - name: Stage the already regression-tested release source
        id: deploy
        run: |
          npm install --global vercel@62.2.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify version and isolated registration
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node --import tsx scripts/verify-release-health.ts
          EXPECTED_GAME=asteroids-coop node --import tsx scripts/check-game-registration.ts
      - name: Verify four seats, recovery and ten-minute creator continuity
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          LONG_SESSION_SECONDS: '600'
        run: node --import tsx scripts/asteroids-live-session.ts
      - name: Promote the verified Asteroids deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
      - name: Verify the stable dedicated endpoint
        env:
          SERVER_URL: https://rmc-asteroids-coop.vercel.app
          LONG_SESSION_SECONDS: '8'
        run: |
          node --import tsx scripts/verify-release-health.ts
          node --import tsx scripts/asteroids-live-session.ts
