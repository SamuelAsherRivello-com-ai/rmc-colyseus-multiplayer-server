name: Deploy verified Tetris shared relay release
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
permissions:
  contents: read
concurrency:
  group: vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:typescript-source
      - run: npm run typecheck
      - name: Require immutable main source and the free Hobby plan
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          node --import tsx scripts/workflows/deploy-tetris-1.ts
      - run: npm run check:docs
      - name: Verify every registered game locally
        run: npm test
      - name: Stage the selected source on the existing shared project
        id: deploy
        run: |
          npm install --global vercel@62.2.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify the staged release version
        run: node --import tsx scripts/verify-release-health.ts
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
      - name: Verify Tetris and every private game affected by the SDK repair
        run: node --import tsx --test --test-concurrency=1 multiplayer-server/test/bomberman-integration.ts multiplayer-server/test/combat-integration.ts multiplayer-server/test/ring-rivals-integration.ts multiplayer-server/test/space-invaders.ts multiplayer-server/test/tetris-duel-integration.ts
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
      - name: Verify a four-minute two-client Hobby relay session
        run: npm run verify:long-session
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          LONG_SESSION_SECONDS: '240'
      - name: Promote the verified shared deployment
        id: promote
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
      - name: Verify stable version, real relay and private Tetris gameplay
        env:
          SERVER_URL: https://rmc-colyseus-multiplayer-server.vercel.app
        run: |
          node --import tsx scripts/verify-release-health.ts
          npm run probe
          node --import tsx --test multiplayer-server/test/tetris-duel-integration.ts
      - name: Restore the previous deployment if stable verification fails
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        run: vercel rollback --token="$VERCEL_TOKEN"
