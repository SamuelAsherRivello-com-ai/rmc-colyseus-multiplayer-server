name: Configure isolated free Asteroids project
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check:typescript-source
      - run: npm run typecheck
      - name: Provision only a Hobby project and first-party storage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          node --import tsx scripts/workflows/asteroids-project-setup-1.ts
      - uses: actions/upload-artifact@v4
        with:
          name: asteroids-project
          path: asteroids-project.json
