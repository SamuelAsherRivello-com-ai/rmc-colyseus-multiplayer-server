name: Deploy backend release
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Release commit or tag at the current main commit
        required: true
permissions:
  contents: read
concurrency:
  group: vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:typescript-source
      - run: npm run typecheck
      - name: Require the selected source to be in main history
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
      - run: npm run check:docs
      - run: npm test
      - name: Stage the selected source with production settings
        id: deploy
        run: |
          npm install --global vercel@62.2.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify the staged deployment serves the selected version
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
        run: node --import tsx scripts/verify-release-health.ts
      - name: Verify every registered game against the staged deployment
        run: |
          set -o pipefail
          # Keep every assertion. A single bounded rerun addresses transient
          # public-network/cold-instance failures, with both attempts retained.
          state="$RUNNER_TEMP/staged-game-tests.json"
          node --import tsx --test --test-concurrency=1 --test-rerun-failures="$state" multiplayer-server/test/*.ts 2>&1 | tee "$RUNNER_TEMP/staged-game-first.log" && exit 0
          echo "::warning::Staged public checks had failures. Rerunning failed tests once; all must pass before promotion."
          node --import tsx --test --test-concurrency=1 --test-rerun-failures="$state" multiplayer-server/test/*.ts 2>&1 | tee "$RUNNER_TEMP/staged-game-rerun.log"
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
      - name: Retain staged verification attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-game-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staged-game-tests.json
            ${{ runner.temp }}/staged-game-first.log
            ${{ runner.temp }}/staged-game-rerun.log
          if-no-files-found: ignore
      - name: Verify private Tetris relay gameplay and recovery
        run: node --import tsx --test multiplayer-server/test/tetris-duel-integration.ts
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
      - name: Verify a Vercel Hobby-compatible four-minute relay session
        run: npm run verify:long-session
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          LONG_SESSION_SECONDS: '240'
      - name: Verify the four-minute Space Invaders session and host migration
        run: node --import tsx scripts/space-invaders-session.ts
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          LONG_SESSION_SECONDS: '240'
      - name: Verify ten-minute Asteroids continuity and fixed host renewal
        run: node --import tsx scripts/asteroids-live-session.ts
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          LONG_SESSION_SECONDS: '600'
      - name: Promote the verified deployment to the stable production URL
        id: promote
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
      - name: Verify the stable production URL serves the selected version
        env:
          SERVER_URL: https://rmc-colyseus-multiplayer-server.vercel.app
        run: node --import tsx scripts/verify-release-health.ts
      - name: Verify two clients relay through the stable production URL
        env:
          SERVER_URL: https://rmc-colyseus-multiplayer-server.vercel.app
        run: npm run probe
      - name: Verify Combat through the stable production URL
        env:
          SERVER_URL: https://rmc-colyseus-multiplayer-server.vercel.app
        run: node --import tsx --test multiplayer-server/test/combat-integration.ts
      - name: Verify Asteroids through the stable production URL
        run: node --import tsx scripts/asteroids-live-session.ts
        env:
          SERVER_URL: https://rmc-colyseus-multiplayer-server.vercel.app
          LONG_SESSION_SECONDS: '8'
      - name: Restore the previous production deployment if public verification fails
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        run: vercel rollback --token="$VERCEL_TOKEN"

