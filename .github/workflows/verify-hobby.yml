name: Verify free Vercel Hobby hosting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check:typescript-source
      - run: npm run typecheck
      - name: Confirm Hobby and inspect the existing project
        run: |
          node --import tsx scripts/workflows/verify-hobby-1.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hobby-verification
          path: hobby-verification.json
