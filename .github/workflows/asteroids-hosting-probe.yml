name: Probe Vercel first-party Asteroids relay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check:typescript-source
      - run: npm run typecheck
      - run: npm run build:probe-handlers
      - name: Build isolated capability probe
        run: |
          mkdir -p .hosting-probe/api
          node --import tsx scripts/workflows/asteroids-hosting-probe-3.ts
          npm install --prefix .hosting-probe --ignore-scripts
          npm install --global vercel@62.2.0
          node --import tsx scripts/workflows/asteroids-hosting-probe-2.ts
      - name: Stage probe without changing the production alias
        id: deploy
        run: |
          probe_secret="$(node --import tsx scripts/create-probe-secret.ts)"
          echo "::add-mask::$probe_secret"
          echo "PROBE_SECRET=$probe_secret" >> "$GITHUB_ENV"
          vercel pull --yes --environment=preview --cwd .hosting-probe --token="$VERCEL_TOKEN"
          url="$(vercel deploy --prebuilt --yes --cwd .hosting-probe --env PROBE_SECRET="$probe_secret" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify fresh cross-function cache visibility and record latency
        env:
          PROBE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node --import tsx scripts/workflows/asteroids-hosting-probe-1.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asteroids-cache-probe
          path: asteroids-cache-probe.json


