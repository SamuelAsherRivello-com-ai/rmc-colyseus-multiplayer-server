name: Verify Render service
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:typescript-source
      - run: npm run typecheck
      - name: Verify Render configuration and health
        run: node --import tsx scripts/check-credentials.ts
      - name: Two-client public admission check
        run: npm run probe
        env:
          SERVER_URL: ${{ vars.RENDER_SERVICE_URL }}
      - name: Verify a public session beyond five minutes
        run: npm run verify:long-session
        env:
          SERVER_URL: ${{ vars.RENDER_SERVICE_URL }}
          LONG_SESSION_SECONDS: '360'
