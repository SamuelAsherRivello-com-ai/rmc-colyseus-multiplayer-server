name: Cross-host drawing
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        description: Shared probe identifier
permissions:
  contents: read
jobs:
  drawing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:typescript-source
      - run: npm run typecheck
      - run: node --import tsx scripts/drawing-cross-host.ts
        env:
          SERVER_URL: ${{ vars.RENDER_SERVICE_URL }}
          PROBE_RUN: ${{ inputs.run_id }}
          PROBE_HOST: github-runner
          PROBE_SECONDS: '75'

