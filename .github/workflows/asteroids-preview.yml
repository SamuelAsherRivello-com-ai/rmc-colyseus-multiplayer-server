name: Verify Asteroids first-party continuity preview
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Continuity duration (600 for acceptance, 8 for focused diagnostics)
        default: "600"
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:typescript-source
      - run: npm run typecheck
      - name: Build and deploy a preview without changing production
        id: deploy
        run: |
          npm install --global vercel@62.2.0
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify ten minutes across two planned connection windows
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          LONG_SESSION_SECONDS: ${{ inputs.seconds }}
        run: node --import tsx scripts/asteroids-live-session.ts

