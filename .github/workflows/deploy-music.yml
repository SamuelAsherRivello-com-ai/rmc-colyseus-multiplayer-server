name: Deploy isolated Music backend release
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
permissions:
  contents: read
concurrency:
  group: vercel-music-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.MUSIC_VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require immutable main source, dedicated project and Hobby plan
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          test -n "$VERCEL_PROJECT_ID"
          node --input-type=module <<'NODE'
          const response=await fetch(`https://api.vercel.com/v2/teams/${process.env.VERCEL_ORG_ID}`,{headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`}});
          const team=await response.json();if(!response.ok||team.billing?.plan!=='hobby')throw new Error('Free Hobby plan is required.');
          console.log('Verified free Hobby plan; no paid features enabled.');
          NODE
      - run: npm ci
      - run: npm run check:docs
      - run: npm run typecheck
      # Version preparation may safely rebase over concurrent main changes.
      # Verify the final immutable source, including any such changes.
      - run: npm test
      - name: Stage the already regression-tested release source
        id: deploy
        run: |
          npm install --global vercel@62.2.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify version and isolated registration
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node scripts/verify-release-health.mjs
          node --input-type=module -e 'const data=await(await fetch(process.env.SERVER_URL+"/api/health")).json();if(JSON.stringify(data.games)!==JSON.stringify(["music-maker"]))throw Error("Dedicated deployment must register only Music");'
      - name: Verify music admission, creator authority and two-client relay
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          MUSIC_PROBE_SECONDS: '8'
        run: |
          node --import tsx --test multiplayer-server/test/music-integration.mjs
          node scripts/music-probe.mjs
      - name: Promote the verified Music deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
      - name: Verify the stable dedicated endpoint
        env:
          SERVER_URL: https://rmc-music-maker.vercel.app
          MUSIC_PROBE_SECONDS: '8'
        run: |
          node scripts/verify-release-health.mjs
          node scripts/music-probe.mjs
