name: Inspect hosting capabilities
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect configured Vercel metadata without secret values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node --import tsx scripts/workflows/hosting-diagnostics-1.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hosting-capabilities
          path: hosting-capabilities.json
